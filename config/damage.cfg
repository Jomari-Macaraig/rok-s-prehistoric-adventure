; =====================================================================
;  Rok Runner - damage: what each obstacle costs in hearts
;
;  Running into an obstacle costs hearts; the run ends when the hearts run
;  out. Each obstacle belongs to a TIER; each tier costs a number of
;  QUARTER hearts (4 = one heart). The form's Armor softens every hit:
;      cost = tier quarters x (1 - Armor / armor_divisor), rounded up,
;  never below 1 quarter. Read by scripts/hearts.gd (Hearts). Save and
;  restart the game. Lines starting with ; are comments.
;
;  To make something hurt more or less, move it to another tier below,
;  or change a tier's quarters. You can add a tier (any name) and move
;  obstacles into it.
;
;  STILL INSTANT (the user's rule, not set here): pits and chasms, water,
;  lava, quicksand, a dino gate's wall with the wrong form, and being caught
;  by the hunter.
; =====================================================================

[armor]
; Armor 10 halves a hit at 20 (a heavy 1-heart crash costs half a heart).
armor_divisor = 20.0

[tiers]
; quarter hearts per tier, before Armor
light = 1       ; 1/4 heart
medium = 2      ; 1/2 heart
heavy = 4       ; 1 heart

[obstacles]
; obstacle = tier
; --- light: little stumbles
small = "light"            ; a small rock or twig (trip); meteors land as small rocks
mushroom = "light"         ; Forest mushroom (dizzy)
thorns = "light"           ; thorn bush / tumble-thorn
steam = "light"            ; a steam vent's blast
; --- medium
vine = "medium"            ; Forest vine ledge (snag)
log = "medium"             ; logs and each zone's log (skull, spine, rock spikes...)
fence = "medium"           ; a low fence (ribs, barricade, obsidian spikes)
stampede = "medium"        ; a running wild dinosaur bumps Rok
swooper = "medium"         ; a swooping or diving flyer
; --- heavy: crashing into something solid
boulder = "heavy"
tall_fence = "heavy"
wall = "heavy"             ; a 2- or 3-high wall
ledge = "heavy"            ; a solid low ledge (Desert fossil arch, Volcanic rock, Canyon arch)
rolling_boulder = "heavy"
