; Hero skill trees. Each hero level from 2 to 20 gives one skill point (19 in
; all). A hero has three branches of five skills, bottom to top, costing
; `costs` points each (1, 1, 2, 2, 3: 9 a branch, 27 for all, so two
; branches fill but not three); each skill needs the one below it. Reset is
; free. Read by scripts/skills.gd; see docs/systems/heroes.md#skill-trees.
;
; A skill's `value` is its number (a multiplier, metres, quarter hearts...),
; read by the code that applies it. Movement skills (Quick Feet, Air Step,
; Light Feet) work only in the hero's own form; the rest all run long.

[general]
costs = [1, 1, 2, 2, 3]

[tree.rok]
branches = ["runner", "brawler", "survivor"]

[branch.runner]
name = "Runner"
color = "#4f9a3a"
skills = ["quick_feet", "air_step", "slipstream", "light_feet", "second_wind"]

[branch.brawler]
name = "Brawler"
color = "#c0562a"
skills = ["heavy_swing", "quick_hands", "rock_breaker", "combo_strike", "ground_pound"]

[branch.survivor]
name = "Survivor"
color = "#3c74b5"
skills = ["tough_hide", "shake_it_off", "iron_will", "patch_up", "last_stand"]

