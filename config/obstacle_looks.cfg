; =====================================================================
;  Rok Runner - obstacle looks: a NEW banner for each one
;
;  A small hazard comes in many looks (a rock, a mushroom, a twig, and in
;  other zones a raptor skull, a bone pile, an ember rock...). Each look
;  gets its own NEW banner the first time it comes on screen, so nothing
;  surprises the player (the user's rule: rocks and mushrooms aren't
;  grouped). Up to two banners show at once. Read by
;  scripts/obstacle_looks.gd (ObstacleLooks). Save and restart the game.
;
;  One section per look:
;    art      the art names that show this look (prop, canyon or biome
;             animation names, as in scripts/course.gd)
;    name     the banner's title (after "NEW: ")
;    hint     the banner's second line
;    lesson   optional: an introduction key (config/progression.cfg) whose
;             own banner already teaches this look, so it gets no extra one
;
;  To give a log, fence or other hazard's look its own banner, add a
;  section with its art names the same way.
; =====================================================================

[rock]
art = ["Stones_01", "Stones_02", "Stones_03"]
name = "Rocks"
hint = "Tap JUMP to leap over them. Run into one and you trip (the hunter gains)."
lesson = "small"

[mushroom]
art = ["Mushrooms_02", "Mushrooms_05"]
name = "Mushrooms"
hint = "Jump over them. Run into one and you're dizzy: lower jumps for a few seconds."

[twig]
art = ["Logs_05"]
name = "Twigs"
hint = "A fallen twig: jump it, or you trip like on a rock."

[loose_stones]
art = ["stone_scatter"]
name = "Loose Stones"
hint = "Canyon rubble: jump it, or you trip."

[raptor_skull]
art = ["biome_raptor_skull"]
name = "Raptor Skulls"
hint = "Old bones in the sand: jump them, or you trip."

[bone_pile]
art = ["biome_bone_pile"]
name = "Bone Piles"
hint = "A heap of bones: jump it, or you trip."

[sandstone_shard]
art = ["biome_sandstone_shard"]
name = "Sandstone Shards"
hint = "A sharp chunk of sandstone: jump it, or you trip."

[ember_rock]
art = ["biome_ember_rock"]
name = "Ember Rocks"
hint = "Still glowing from the volcano: jump them, or you trip."

[obsidian_shards]
art = ["biome_obsidian_shard_cluster"]
name = "Obsidian Shards"
hint = "Glassy black spikes: jump them, or you trip."

[pumice_lump]
art = ["biome_pumice_lump"]
name = "Pumice Lumps"
hint = "Light volcanic stone: jump it, or you trip."
