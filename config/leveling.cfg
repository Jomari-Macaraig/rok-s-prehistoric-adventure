; Levels: heroes and dinosaurs level up by themselves the moment they have the
; XP (no meat, no Camp trip), from 1 to max_level. Read by Dinos._load_config()
; (scripts/dinos.gd); anything missing falls back to the DEFAULT_* there.
; See docs/systems/leveling.md.

[xp]
; 1 XP per metre run as that character (times the run's rank and the
; Seasoned perk). Reaching level L takes, in total:
;   first_level_m x (L-1) + step_m x (L-1)(L-2)/2
; so level 2 = 300 m, 3 = 750, 5 = 2,100, 10 = 8,100, 20 = 31,350.
max_level = 20
first_level_m = 300.0
step_m = 150.0
; The other equipped dinosaurs earn this share of every metre run (as Rok or
; another dinosaur), so the whole team grows a little.
team_share = 0.1

[growth]
; Each dinosaur level raises one attribute by about half a point (less the
; higher it already is). Which one: a repeating pattern of ranks, 1 = the
; dinosaur's best attribute (highest base value), 2 = its second best, ...
; A capped attribute passes its turn to the next rank. [1, 2, 1, 3] gives the
; best attribute half the levels. Heroes don't grow attributes by level: they
; get skill points (docs/wayfinder/campaign-build/08-rok-skill-tree.md).
pattern = [1, 2, 1, 3]
