; =====================================================================
;  Rok Runner - loading screen hints
;
;  The loading screen shows a random hint and changes it every few
;  seconds. Add, edit or remove lines freely. Read by scripts/preloader.gd.
;  Lines starting with ; are comments.
;
;  Each hint:   any_name = ["the text", "needs"]
;  "needs" says when the player is ready for that hint ("" = always):
;    "800"            best distance of at least 800 m
;    "dino:raptor"    that dinosaur is unlocked (raptor, triceratops,
;                     spinosaurus, pteranodon; distances from
;                     config/progression.cfg [dinos])
;    "intro:<key>"    that thing has been introduced
;                     (config/progression.cfg [introductions] key)
;    "bench"          the Crafting Bench is open (config/crafting.cfg)
;    "slot2"          the second power-up slot is open
;    "charge"         the hunter's first charge (config/progression.cfg [trex])
;  A hint the player isn't ready for is never shown, so nothing is spoiled.
; =====================================================================

[settings]
; seconds each hint stays before the next
seconds = 3.5

[hints]
; --- the basics
jump_hold = ["Hold JUMP to leap higher. Tap twice for a double jump.", ""]
slide = ["Slide under low ledges and vines. Hold SLIDE as you reach them.", ""]
attack = ["ATTACK breaks small rocks and logs ahead. A green marker shows what it can hit.", ""]
hearts = ["Crashing costs a heart, but pits, liquids and being caught end the run.", ""]
hunter = ["Stumbles let the hunter catch up. Run clean to keep your lead.", ""]
amber = ["Amber fills your PRIMAL energy: you need it to shapeshift.", ""]
meat = ["Meat is money: it's banked at the end of every run, even a short one.", ""]
flag = ["A flag marks your best distance. Pass it and Rok celebrates!", "300"]
combo = ["Clear hazards without stumbling to build a combo: up to x5 points.", "300"]
frenzy = ["Fill the combo meter for Primal Frenzy: smash through everything for a few seconds.", "600"]
missions = ["Three daily missions pay meat. They change every day.", ""]
power_up = ["Power-ups wait in their slot until you use them. Save one for the hunter.", ""]
encyclopedia = ["Elder Numa knows a story about everything you meet. Visit the Encyclopedia.", ""]
; --- dinosaurs
raptor = ["The Raptor outruns the hunter and has a double jump.", "dino:raptor"]
raptor_bridge = ["Crumbling bridges break under heavy feet. Only light dinosaurs cross them.", "dino:raptor"]
quicksand = ["The Raptor barely sinks in quicksand. Rok gets swallowed.", "dino:raptor"]
triceratops = ["The Triceratops smashes boulder walls that nothing else can pass.", "dino:triceratops"]
spinosaurus = ["The Spinosaurus swims across flooded crossings and tramples thorns.", "dino:spinosaurus"]
pteranodon = ["Hold JUMP as the Pteranodon to fly over wide canyons and lava.", "dino:pteranodon"]
energy = ["Dinosaurs drain energy faster the longer you stay one. Switch back to Rok to reset it.", "dino:raptor"]
camp = ["Level up your heroes and dinosaurs at the Dinosaur Camp.", "dino:raptor"]
market_dinos = ["The Market sells new dinosaurs for each button, each with its own strengths.", "dino:raptor"]
; --- the world
chest = ["Every 1000 m a treasure chest waits on the trail. Later ones are rarer.", "1000"]
zones = ["The trail runs through the Forest, the Desert and the Volcanic Badlands.", "1500"]
laps = ["Each lap of the zones adds a twist like a storm or fog, and pays more.", "4500"]
wild = ["Wild dinosaurs charge at you. Jump them, and the hunter eats them!", "intro:stampede"]
charge = ["When the hunter roars, it's about to charge. Keep moving!", "charge"]
; --- crafting and gear
bench = ["Craft weapons and armor at the Crafting Bench in the Dinosaur Camp.", "bench"]
materials = ["Break rocks and logs and bonk wild dinosaurs to find crafting materials.", "bench"]
rarity = ["Every craft rolls a rarity, from Common to Legendary. Catalysts improve the odds.", "bench"]
salvage = ["Salvage gear you don't need to get half its materials back.", "bench"]
cards = ["Bonk a wild dinosaur and it may drop its card. Put cards in a hero's weapon slot.", "intro:stampede"]
repair = ["Weapons wear out with every hit. Repair them at the Dinosaur Camp.", "bench"]
slot2 = ["You can carry two power-ups now. A third slot is sold in the Market.", "slot2"]
