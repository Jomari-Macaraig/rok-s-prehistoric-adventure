; =====================================================================
;  Rok Runner - progression settings
;
;  Edit the numbers below to change WHEN things appear. Distances are in
;  metres travelled in a single run. Save the file and restart the game.
;  Lines starting with ; are comments.
;
;  The banner/card text for each item lives in scripts/progression.gd
;  (INTRO_TEXT); only the distances are set here.
;
;  THE SCHEDULE - spread out so progress takes many runs (the user asked
;  for it: one long run shouldn't unlock most things). Roughly one new thing
;  every 250-500 m; zones change every 1500 m ([zones] length_m) and repeat
;  every 4500 m,
;  so zone lessons sit inside one of their zone's visits.
;
;      0  Rocks & Mushrooms           2200  PTERANODON + Wide Canyon
;    160  Logs, 240 Hills             2340  Stampedes
;    300  Low Ledges (SLIDE)          2480  Combos (known hazards)
;    870  starter chest               2740  Swoopers
;    450  RAPTOR + Crumbling Bridge   3000  ZONE: Volcanic Badlands
;    600  Dino Egg, 720 wild preview  3150  Steam Vents (Volcanic)
;   1000  TRICERATOPS + Barricade     3760  2nd BOOSTER SLOT
;   1150  Pits                        3900  Rolling Boulders (Volcanic)
;   1400  Slopes                      4100  Diving Flyers
;   1500  ZONE: Desert                4450  Drops
;   1600  SPINOSAURUS + Bramble Wall  5000  Flooded Crossing (Forest)
;   1750  Quicksand (Desert)          5400  T-REX CHARGE (again at 7800,
;   1900  Boulders                          then every 2400 m)
;                                     5680  Big Hills ... 9400 Tougher Combos
;
;  The four dinosaur buttons come early and evenly (the user's call):
;  450 / 1000 / 1600 / 2200 m, each with its dino trap. Slide is still
;  taught before the Raptor. No amber appears before the first dinosaur
;  (config/requirements.cfg). Around each big moment (unlock, first zone
;  visit, booster slot) lessons are kept ~100 m clear before and
;  marinate_m after; check with tests/timeline_probe.gd.
;  Each zone has its own stampede and swooper species (scripts/critters.gd).
;
;  A new hazard can only come marinate_m after the previous new thing and
;  not within big_clearance_m before a big moment, so keep each one at
;  least that far from its neighbours or it will slip later.
;
;  Market items go on sale at 0 / 1800 / 3000 / 5000 / 6000 / 6600 m (some
;  also need a badge; dinosaurs follow their category's tiers) and
;  are announced on the game-over screen (and marked NEW in the Market),
;  so they never interrupt a run.
;
;  Big moments (DINOS, first visit to a ZONE, booster SLOT) are kept
;  clear: a new hazard never shows up within big_clearance_m before one,
;  and every new thing waits marinate_m after the previous one.
; =====================================================================

[dinos]
; Best distance (in one run) needed to unlock each dinosaur. Unlocks are
; permanent. The moment one unlocks, its dino trap comes right after.
raptor=450
triceratops=1000
spinosaurus=1600
pteranodon=2200

[trex]
; T-REX CHARGES: at these distances the T-rex roars and charges for a few
; seconds, gaining on Rok fast. Escape as a Runner, with an egg boost, or by
; sliding downhill. After the last one listed, it charges again every
; charge_every_m metres.
charge_m=[5400, 7800]
charge_every_m=2400

[boosters]
; Booster slots. Rok starts with ONE slot. The second slot unlocks
; permanently the first time a run reaches slot_2 metres, well before the
; first hunter charge (5400 m). The third slot (the maximum) is sold in the
; Market once you reach 6000 m.
slot_2=3760

[market]
; Market prices, in MEAT (raised x1.5 so items take a few runs to afford;
; badge rewards were lowered at the same time, scripts/badges.gd TIER_REWARD). Meat shows up in runs in place of some of the
; amber (amber arcs, floating islands, sky trails). Every piece Rok collects
; is banked when the run ends, and spent here. Bought items are permanent.
; About 4-5 meat appear per 1000 m (tests/amber_probe.gd: ~18 by 4000 m),
; in groups of 3; a player grabs most of it.
; Power-ups: once bought they start appearing in runs.
