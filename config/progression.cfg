[market_badges]
; DINOSAUR TIERS. Each category (one per dino button) has 7 Market
; dinosaurs in four tiers. Starter (2): distance only. Skilled (2), Expert (2)
; and Legend (1) also need that category's OWN badge at Bronze, Silver and
; Gold, earned by playing the category: Runners -> Swift Feet (metres as a
; Runner), Smashers -> Rock Breaker (obstacles smashed), Tanks -> Iron Hide
; (metres as a Tank), Flyers -> Sky Rider (metres flown). So the more you play
; a dinosaur, the more of its kind you unlock. Starters are the forgiving
; all-rounders; the higher tiers are sharper specialists.
; Value = "badge id:tier" (badge ids are in scripts/badges.gd); a dinosaur
; with no line here is a Starter.
; Power-ups that match a badge:
fossil_magnet="amber:1"
primal_berry="primal:1"
golden_fossil="clean:2"
