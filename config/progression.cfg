[zones]
; Metres per zone: Forest -> Desert -> Volcanic Badlands, then again (a lap
; is 3 zones; each lap after the first adds a twist). Was 1000; the user
; found the zones changed too fast. If you change it, move the zone-only
; lessons above (quicksand, steam, rolling_boulder, gate_water, gate_lava)
; so each still sits inside one of its zone's visits.
length_m=1500

[early]
; The first 800 m, before the Raptor (the user asked for it not to be boring).
; starter_chest_m: an extra chest in every run before the first 1000 m
;   milestone (0 = none).
; stampede_preview_m: one slow wild dinosaur from the zone runs at Rok, with
;   a banner (no card, so it doesn't hold lessons back), until the real
;   Stampede lesson has been taught. stampede_preview_speed scales its speed.
starter_chest_m=870
stampede_preview_m=720
stampede_preview_speed=0.5

[pacing]
; Metres after something new (a hazard, an unlock, a new zone) before the
; next new hazard may be introduced, so each one has time to sink in.
marinate_m=130
; A new hazard never appears this close BEFORE a big moment (a dino unlock,
; the first visit to a zone, a booster slot), so the two don't pile up.
; Quicksand, steam vents and rolling boulders (zone lessons) go first
; while you're in their zone, so they never miss it.
big_clearance_m=100
; How many times a new hazard appears on its own (with extra space).
intro_solo_spawns=3
; Combos only use hazards introduced at least this many metres ago.
familiar_after_m=300
; Dino traps appear every gate_spacing_min..gate_spacing_max metres
; (once at least one dinosaur is unlocked).
gate_spacing_min=200
gate_spacing_max=340
; After entering a zone, one of its signature dino traps comes within:
zone_showcase_m=120
; Difficulty ramp (shorter gaps, wider pits) starts and maxes out at:
ramp_start_m=4000
ramp_full_m=12000
