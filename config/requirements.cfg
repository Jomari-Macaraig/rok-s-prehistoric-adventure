; =====================================================================
;  Rok Runner - the dependency tree: what needs what before it happens
;
;  Each line:  thing = [requirement, requirement, ...]
;  The thing only happens once ALL its requirements are met. Things not
;  listed have no requirement. Save and restart the game.
;  Read by scripts/requires.gd. Lines starting with ; are comments.
;
;  THINGS (left side)
;    pickup.<kind>   a pickup spawning anywhere: amber, meat, heart, fossil,
;                    pepper (or any power-up id)
;    intro.<key>     a hazard, terrain feature or dino gate appearing (keys
;                    as in config/progression.cfg [introductions])
;    event.<id>      a mid-run event: golden_hour, meteor_shower,
;                    amber_storm, stampede_rush
;    power.<id>      a power-up turning up in reward spots and drops
;    market.<id>     a Market item going on sale (on top of its distance
;                    and badge in config/progression.cfg)
;
;  REQUIREMENTS (right side)
;    "dino"          at least one dinosaur unlocked
;    "form:raptor"   that dinosaur unlocked (raptor, triceratops,
;                    spinosaurus, pteranodon)
;    "seen:<key>"    that lesson already taught (e.g. "seen:pit")
;    "best_m:2000"   a best distance of at least 2000 m
;    "owns:<id>"     owns that item (a power-up, gear, dinosaur or hero)
;    "slots:2"       at least 2 booster slots open
;
;  THE TREE TODAY
;    a dinosaur unlocked
;      +-- amber (pickups anywhere: reward spots, under ledges, drops)
;      +-- the Amber Storm event
;      +-- the Primal Amber power-up (spawning, and on sale in the Market)
; =====================================================================

[requires]
; Amber is energy for dinosaur forms: pointless before the first dinosaur.
pickup.amber=["dino"]
event.amber_storm=["dino"]
; Primal Amber (the old Amber Shield) refills PRIMAL energy: also only useful
; with a dinosaur, so it neither spawns nor goes on sale before one.
pickup.amber_shield=["dino"]
power.amber_shield=["dino"]
market.amber_shield=["dino"]
