; =====================================================================
;  Rok Runner - crafting: materials, recipes, rarity, drops
;
;  Weapons and armor are never bought: they are CRAFTED at the Crafting
;  Bench from MATERIALS found in runs (and the basic ones bought in the
;  Market's Gear tab). Every craft rolls a RARITY that multiplies the
;  item's attribute bonuses and durability.
;  Read by scripts/crafting.gd at startup; anything missing falls back to
;  the default in that script. Lines starting with ; are comments.
;  Save and restart the game after editing.
;
;  RARITY TIERS are numbered 0-4: 0 Common, 1 Uncommon, 2 Rare, 3 Epic,
;  4 Legendary. Lists below always have five numbers, one per tier.
;
;  WHEN A RECIPE CAN BE CRAFTED
;  A recipe is learned once the best distance reaches the item's
;  distance in config/progression.cfg [market_unlocks] (e.g. stone_axe).
;  Its stats (bonuses, reach, durability) are in scripts/gear.gd ITEMS.
; =====================================================================

[unlock]
; the Crafting Bench opens once your best distance (one run) reaches this.
; Until then the Camp's Crafting button shows the distance, and the Market
; doesn't sell materials (runs still drop them, ready for when it opens).
bench_m = 500

[materials]
