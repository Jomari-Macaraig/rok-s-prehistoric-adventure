[market]
; how many of a material one Market purchase gives
bundle = 5

[recipes]
; item id (scripts/gear.gd ITEMS) = {material: how many}
club = {"wood": 6, "fiber": 2}
stone_axe = {"wood": 4, "stone": 4, "fiber": 3}
flint_spear = {"wood": 6, "flint": 5, "fiber": 3}
torch = {"wood": 5, "fiber": 3, "resin": 3}
bone_hammer = {"bone": 6, "stone": 4, "hide": 3}
sling = {"hide": 6, "fiber": 4, "stone": 4}
bow = {"wood": 6, "fiber": 6, "flint": 4, "dino_scale": 2}
hide_vest = {"hide": 6, "fiber": 3}
bone_guards = {"bone": 6, "hide": 4}
scale_mail = {"dino_scale": 8, "hide": 4}
shell_plate = {"shell": 2, "hide": 4, "bone": 4}

[rarity]
names = ["Common", "Uncommon", "Rare", "Epic", "Legendary"]
; chance weights of each rarity for a craft without a catalyst
chances = [60, 25, 10, 4, 1]
; the item's attribute bonuses are multiplied by this
bonus_mult = [1.0, 1.2, 1.45, 1.75, 2.1]
; its durability (hits before it breaks) is multiplied by this
durability_mult = [1.0, 1.25, 1.5, 2.0, 2.5]

[catalysts]
; adding ONE of these to a craft replaces the chance weights above
resin = [45, 32, 15, 6, 2]
obsidian = [35, 35, 19, 8, 3]
fossil_shard = [15, 35, 30, 15, 5]
primal_crystal = [0, 15, 40, 30, 15]

[salvage]
; breaking down an item returns this share of its recipe (rounded down)
share = 0.5
; ...plus one of this material by the item's rarity ("" = nothing)
bonus = ["", "", "resin", "fossil_shard", "primal_crystal"]

[repair]
; Repairs cost MEAT (the campaign redesign): a full repair of a Worn Out
; piece costs this much by rarity (Common, Uncommon, Rare, Epic, Legendary),
; less if only partly worn (at least 1). Upgrades (ticket 11) will add to it.
meat = [20, 35, 60, 100, 160]

[drop_rarity]
; Materials found in runs are RARE (the user's rule). Every drop table below
; is weighted by these multipliers by the material's rarity (0 Common ..
; 4 Legendary), so a Rare material drops far less often than a Common one
; in the same table. 1.0 = its table weight as written.
weights = [1.0, 0.45, 0.15, 0.05, 0.015]

[break_drops]
; a broken obstacle drops materials with this chance (on top of the
; normal break loot in config/pickups.cfg)
chance = 0.15
; how many pieces drop
count = [1, 2]
; what drops, by the kind of thing broken (weights, so 3 is 3x as likely as 1;
; then [drop_rarity] applies). A "<kind>_<zone>" table (e.g. fiber_desert)
; is used in that zone when it exists, otherwise the plain one.
wood = {"wood": 3, "fiber": 1}
fiber = {"fiber": 3, "wood": 1}
fiber_forest = {"fiber": 3, "fern_frond": 2, "wood": 1}
fiber_desert = {"cactus_spine": 3, "fiber": 1}
mushroom = {"mushroom_cap": 3, "fiber": 1}
rock_forest = {"stone": 4, "flint": 1}
rock_desert = {"sandstone": 3, "stone": 2, "flint": 3}
rock_canyon = {"sandstone": 4, "stone": 2, "flint": 2}
rock_volcanic = {"basalt": 3, "stone": 1, "obsidian": 2, "sulfur": 1}
meteor = {"obsidian": 2, "meteorite_iron": 2, "star_metal": 1}

[wild_drops]
; a wild dinosaur Rok bonks (or bowls over in a frenzy) drops materials
chance = 0.3
count = [1, 2]
land = {"hide": 6, "bone": 4, "sinew": 3, "claw": 1.5, "dino_scale": 1.5, "shell": 0.3}
flyer = {"bone": 3, "hide": 2, "feather": 3, "dino_scale": 1.5}
; extra weights a species adds to its table (wild dinosaurs: scripts/critters.gd)
species = {"gallimimus": {"feather": 4}, "kentrosaurus": {"back_plate": 3}, "pachycephalosaurus": {"bone": 3},
	"dimorphodon": {"wing_membrane": 3}, "pteranodon": {"wing_membrane": 3}, "quetzalcoatlus": {"wing_membrane": 4}}

[trophies]
; escaping a hunter's charge sometimes drops its trophy
chance = 0.25
trex = "t_rex_tooth"
carnotaurus = "carnotaurus_horn"
allosaurus = "allosaurus_claw"

[spots]
; this share of reward spots hold materials instead (checked after
; hearts, fossils and power-ups; see config/pickups.cfg [spots])
chance = 0.05
; pickups in a material spot
count = [1, 3]
; what a material spot holds in each zone (weights)
forest = {"wood": 3, "fiber": 3, "stone": 1, "fern_frond": 2, "moss": 2, "mushroom_cap": 1, "wild_berries": 1.5, "clay": 1}
desert = {"flint": 3, "bone": 2, "stone": 1, "sandstone": 2, "cactus_spine": 2, "ochre": 1.5, "bleached_skull": 0.5}
canyon = {"sandstone": 3, "flint": 2, "stone": 1, "ochre": 2, "clay": 1.5, "cactus_spine": 1, "bone": 1}
volcanic = {"obsidian": 2, "stone": 2, "flint": 1, "basalt": 2, "ash": 2, "sulfur": 1, "ember_coal": 1.5}
; deep into a run some spots roll this table instead: none before
; deep_from_m, rising to deep_max of material spots at deep_full_m
deep_from_m = 2500
deep_full_m = 6000
deep_max = 0.5
deep = {"resin": 3, "dino_scale": 3, "horn": 1.5, "tail_club_knob": 1.5, "fossil_shard": 0.6, "fire_opal": 0.5, "primal_crystal": 0.15}
; during an event or a lap twist, this share of material spots roll that
; event's table instead (events: scripts/run_events.gd; twists: weather.gd)
special_chance = 0.5
golden_hour = {"golden_dust": 1}
meteor_shower = {"meteorite_iron": 1}
amber_storm = {"resin": 6, "insect_in_amber": 1}
stampede_rush = {"stampede_dust": 1}
storm = {"storm_glass": 1}
fog = {"fog_pearl": 1}
eclipse = {"eclipse_shard": 1}

[chests]
; a milestone chest can hold materials: how many pieces and from what, per
; chest tier (common, rare, ultra_rare, legendary; config/pickups.cfg [chests])
common_count = 4
common = {"wood": 1, "stone": 1, "fiber": 1, "flint": 1, "hide": 1, "feather": 1, "moss": 1, "sandstone": 1, "basalt": 1, "eggshell": 0.5}
rare_count = 3
rare = {"bone": 1, "resin": 1, "dino_scale": 1, "obsidian": 1, "claw": 1, "horn": 1, "back_plate": 1, "tail_club_knob": 1, "bleached_skull": 1, "eggshell": 1}
ultra_rare_count = 2
ultra_rare = {"shell": 1, "fossil_shard": 1, "dino_scale": 1, "fire_opal": 1, "meteorite_iron": 0.5, "primal_crystal": 0.3, "star_metal": 0.2}
legendary_count = 3
legendary = {"fossil_shard": 1, "fire_opal": 1, "meteorite_iron": 1, "primal_crystal": 0.6, "star_metal": 0.4, "shell": 0.5}

[fossils]
; Fossil Shards a rare fossil pickup gives
shards = 1

[durability]
; How many RUNS (or campaign stages) gear lasts before it's Worn Out, before
; its rarity's durability multiplier. Every run uses 1 from each piece the
; played hero wears. Worn Out gear still works at worn_share of its bonus
; until it's repaired for meat ([repair]). 0 = never wears.
worn_share = 0.5
club = 12
stone_axe = 14
flint_spear = 16
bone_hammer = 18
sling = 20
torch = 15
bow = 20
hide_vest = 12
bone_guards = 14
scale_mail = 16
shell_plate = 18

[card_slots]
; Dinosaur cards aren't equipped: they're slotted into a weapon (the user's
; rule). How many card slots each weapon has (0 = none; only 1 is used so
; far). A slot can stay empty; a slotted card adds its dinosaur's bonus on top
; of the weapon's while the weapon is equipped and not broken. Weapons not
; listed use `default`.
default = 1
club = 1
stone_axe = 1
flint_spear = 1
bone_hammer = 1
sling = 1
torch = 1
bow = 1

[weapon_styles]
; Attack styles (docs/ITEM_ART_PLAN.md): a hero drawn ONCE per style with an
; empty hand and a guide sheet, and the game draws whichever weapon is
; equipped at the grip (tools/prepare_styles.py). Each weapon's style:
; swing, thrust, throw, shoot or fist.
club = "swing"
stone_axe = "swing"
bone_hammer = "swing"
torch = "swing"
flint_spear = "thrust"
sling = "throw"
bow = "shoot"
; true: a hero with that style's clip uses it (Rok has Swing so far);
; false: everyone keeps the old clips with each weapon drawn in.
use_styles = true
; How big a weapon is drawn in a style clip (1 = its carried size), and
; per weapon "<id>_scale" to override it.
scale = 1.2
stone_axe_scale = 1.3
torch_scale = 1.3
