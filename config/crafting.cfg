; =====================================================================
;  Rok Runner - crafting: materials, recipes, rarity, drops
;
;  Weapons and armor are never bought: they are CRAFTED at the Crafting
;  Bench from MATERIALS found in runs (and the basic ones bought in the
;  Market's Gear tab). Every craft rolls a RARITY that multiplies the
;  item's attribute bonuses and durability.
;  Read by scripts/crafting.gd at startup; anything missing falls back to
;  the default in that script. Lines starting with ; are comments.
;  Save and restart the game after editing.
;
;  RARITY TIERS are numbered 0-4: 0 Common, 1 Uncommon, 2 Rare, 3 Epic,
;  4 Legendary. Lists below always have five numbers, one per tier.
;
;  WHEN A RECIPE CAN BE CRAFTED
;  A recipe is learned once the best distance reaches the item's
;  distance in config/progression.cfg [market_unlocks] (e.g. stone_axe).
;  Its stats (bonuses, reach, durability) are in scripts/gear.gd ITEMS.
; =====================================================================

[unlock]
; the Crafting Bench opens once your best distance (one run) reaches this.
; Until then the Camp's Crafting button shows the distance, and the Market
; doesn't sell materials (runs still drop them, ready for when it opens).
bench_m = 500

[materials]
; id = {"name": shown name, "rarity": 0-4 (its frame colour and how
;       rare it is), "price": meat for a Market bundle (0 = never sold),
;       "unlock_m": best distance that puts it on sale in the Market
;       (never before [unlock] bench_m),
;       "from": where it comes from (shown on the Items screen)}
wood = {"name": "Wood", "rarity": 0, "price": 40, "unlock_m": 500, "from": "Breaking logs, fences and bridges. Forest reward spots."}
stone = {"name": "Stone", "rarity": 0, "price": 40, "unlock_m": 500, "from": "Breaking rocks, boulders and walls."}
fiber = {"name": "Fiber", "rarity": 0, "price": 40, "unlock_m": 500, "from": "Breaking vines and thorn bushes. Forest reward spots."}
flint = {"name": "Flint", "rarity": 1, "price": 90, "unlock_m": 1200, "from": "Breaking rocks, mostly in the Desert. Desert reward spots."}
hide = {"name": "Hide", "rarity": 1, "price": 90, "unlock_m": 1200, "from": "Bonking wild land dinosaurs."}
bone = {"name": "Bone", "rarity": 1, "price": 0, "unlock_m": 0, "from": "Bonking wild dinosaurs. Desert reward spots."}
resin = {"name": "Resin", "rarity": 2, "price": 0, "unlock_m": 0, "from": "Deep reward spots in long runs and chests."}
dino_scale = {"name": "Dino Scale", "rarity": 2, "price": 0, "unlock_m": 0, "from": "A rare drop from wild dinosaurs. Rare chests."}
obsidian = {"name": "Obsidian", "rarity": 2, "price": 0, "unlock_m": 0, "from": "Breaking Volcanic rocks and meteors. Volcanic reward spots."}
shell = {"name": "Shell", "rarity": 3, "price": 0, "unlock_m": 0, "from": "Epic chests, and very rarely wild dinosaurs."}
fossil_shard = {"name": "Fossil Shard", "rarity": 3, "price": 0, "unlock_m": 0, "from": "Every rare fossil you pick up. Epic chests."}
primal_crystal = {"name": "Primal Crystal", "rarity": 4, "price": 0, "unlock_m": 0, "from": "Epic chests and very deep reward spots."}

[market]
; how many of a material one Market purchase gives
bundle = 5

[recipes]
; item id (scripts/gear.gd ITEMS) = {material: how many}
club = {"wood": 6, "fiber": 2}
stone_axe = {"wood": 4, "stone": 4, "fiber": 3}
flint_spear = {"wood": 6, "flint": 5, "fiber": 3}
torch = {"wood": 5, "fiber": 3, "resin": 3}
bone_hammer = {"bone": 6, "stone": 4, "hide": 3}
sling = {"hide": 6, "fiber": 4, "stone": 4}
bow = {"wood": 6, "fiber": 6, "flint": 4, "dino_scale": 2}
hide_vest = {"hide": 6, "fiber": 3}
bone_guards = {"bone": 6, "hide": 4}
scale_mail = {"dino_scale": 8, "hide": 4}
shell_plate = {"shell": 2, "hide": 4, "bone": 4}

[rarity]
names = ["Common", "Uncommon", "Rare", "Epic", "Legendary"]
; chance weights of each rarity for a craft without a catalyst
chances = [60, 25, 10, 4, 1]
; the item's attribute bonuses are multiplied by this
bonus_mult = [1.0, 1.2, 1.45, 1.75, 2.1]
; its durability (hits before it breaks) is multiplied by this
durability_mult = [1.0, 1.25, 1.5, 2.0, 2.5]

[catalysts]
; adding ONE of these to a craft replaces the chance weights above
resin = [45, 32, 15, 6, 2]
obsidian = [35, 35, 19, 8, 3]
fossil_shard = [15, 35, 30, 15, 5]
primal_crystal = [0, 15, 40, 30, 15]

[salvage]
; breaking down an item returns this share of its recipe (rounded down)
share = 0.5
; ...plus one of this material by the item's rarity ("" = nothing)
bonus = ["", "", "resin", "fossil_shard", "primal_crystal"]

[repair]
; a full repair costs this share of the recipe (less if only partly worn,
; at least 1 of its first material)
share = 0.3

[break_drops]
; a broken obstacle drops materials with this chance (on top of the
; normal break loot in config/pickups.cfg)
chance = 0.55
; how many pieces drop
count = [1, 2]
; what drops, by the kind of thing broken (weights, so 3 is 3x as likely as 1)
wood = {"wood": 3, "fiber": 1}
fiber = {"fiber": 3, "wood": 1}
rock_forest = {"stone": 4, "flint": 1}
rock_desert = {"stone": 2, "flint": 3}
rock_volcanic = {"stone": 2, "obsidian": 2}
meteor = {"obsidian": 1}

[wild_drops]
; a wild dinosaur Rok bonks (or bowls over in a frenzy) drops materials
chance = 0.7
count = [1, 2]
land = {"hide": 6, "bone": 4, "dino_scale": 1.5, "shell": 0.3}
flyer = {"bone": 3, "hide": 2, "dino_scale": 1.5}

[spots]
; this share of reward spots hold materials instead (checked after
; hearts, fossils and power-ups; see config/pickups.cfg [spots])
chance = 0.14
; pickups in a material spot
count = [1, 3]
; what a material spot holds in each zone (weights)
forest = {"wood": 3, "fiber": 3, "stone": 1}
desert = {"flint": 3, "bone": 2, "stone": 1}
volcanic = {"obsidian": 2, "stone": 2, "flint": 1}
; deep into a run some spots roll this table instead: none before
; deep_from_m, rising to deep_max of material spots at deep_full_m
deep_from_m = 2500
deep_full_m = 6000
deep_max = 0.5
deep = {"resin": 3, "dino_scale": 3, "fossil_shard": 0.6, "primal_crystal": 0.15}

[chests]
; a milestone chest can hold materials: how many pieces and from what
common_count = 4
common = {"wood": 1, "stone": 1, "fiber": 1, "flint": 1, "hide": 1}
rare_count = 3
rare = {"bone": 1, "resin": 1, "dino_scale": 1, "obsidian": 1}
epic_count = 2
epic = {"shell": 1, "fossil_shard": 1, "dino_scale": 1, "primal_crystal": 0.3}

[fossils]
; Fossil Shards a rare fossil pickup gives
shards = 1
