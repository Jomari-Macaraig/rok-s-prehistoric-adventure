; Expansion dinosaurs follow their category's original (Runner = Raptor,
; Smasher = Triceratops, Tank = Spinosaurus, Flyer = Pteranodon), except the
; level 8 milestone, which is their own Signature Trick, written when that
; dinosaur gets its Trail: list it here as <id> = "<milestone id>" with its
; own [milestone.*] section. Until then they have no level 8 milestone.
[signature]
