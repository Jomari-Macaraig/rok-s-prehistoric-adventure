; Dinosaur milestones and evolution (campaign build tickets 04-06).
; At each milestone level a dinosaur learns a Trick (something new its form
; can do) or a Trait (always on), set per species below; at the evolution
; levels it evolves (+1 to every attribute; at the second, its best
; attribute may go 1 past its cap) and glows until evolved art exists.
; Read by scripts/milestones.gd; see docs/systems/dinosaurs.md#milestones.
; `value` is the number the effect's code reads.

[levels]
milestones = [3, 5, 8, 13, 15, 18]
evolutions = [10, 20]

[species.raptor]
3 = "quick_start"
5 = "double_dash"
8 = "light_step"
13 = "pounce"
15 = "pack_instinct"
18 = "triple_jump"

[milestone.quick_start]
name = "Quick Start"
kind = "trait"
text = "Shifting in gives a 1 s burst that gains on the hunter."
value = 60.0

[milestone.double_dash]
name = "Double Dash"
kind = "trick"
text = "ATTACK in the air dashes forward, gaining on the hunter."
value = 30.0

[milestone.light_step]
