; =====================================================================
;  Rok Runner - pickups: amber, meat, hearts, power-ups, fossils
;
;  Edit the numbers to change HOW OFTEN things turn up and WHERE they are
;  placed. Chances are 0-1 (0.1 = 10%). Save and restart the game.
;  Read by scripts/loot.gd; anything missing falls back to the default
;  in scripts/tuning.gd. Lines starting with ; are comments.
;
;  HOW A REWARD SPOT WORKS
;  After most hazards the course may place a reward spot. In order:
;    1. [placement] sky_trail: a high wavy trail (once "sky_trail" is
;       introduced, config/progression.cfg) - easiest reached flying.
;    2. otherwise [placement] islands: floating islands over a simple hazard
;       (small rocks, thorn bush, log, boulder, fence), never near a
;       ledge, wall, gate or combo. A staircase of 2-3 islands with the
;       prize on the top step ([placement] staircase share, from
;       staircase_from_m), else one island holding up to island_max.
;    3. otherwise [placement] arc: an arc over the hazard (rewards the jump).
;    4. otherwise nothing.
;  Then the spot's KIND is rolled ([spots], checked top to bottom):
;    heart  -> one heart            power -> one power-up
;    fossil -> one rare fossil ([escalation], deep in a run only)
;    meat   -> all meat (and always meat if none came for meat_due_m)
;    mixed  -> amber and meat together
;    amber  -> whatever chance is left over
;  Single things (heart, power, fossil) sit at the spot's best place: the
;  far end of a trail, the top island, the middle of an arc.
;  Amber, meat and mixed spots hold 1-4 pickups ([counts] weights).
;
;  BROKEN OBSTACLES ([break_loot])
;  Anything smashed (attack, a dinosaur's smash, a Power break, crashing
;  through) may drop loot where it stood: a heart (amber instead at full
;  health), a power-up, or a few amber.
; =====================================================================

[spots]
; Chance a reward spot holds each kind (amber gets what's left).
heart=0.025
power=0.1
meat=0.1
mixed=0.06
; A spot turns to meat if none came for this many metres.
meat_due_m=400.0

[counts]
; How many pickups an amber, meat or mixed spot holds: chance of 1, 2, 3, 4.
weights=[0.35, 0.3, 0.2, 0.15]
; The most a single floating island holds.
island_max=3

[placement]
; Chance (per hazard pattern) of each placement, tried in this order.
sky_trail=0.12
islands=0.22
arc=0.45
; Share of island spots built as a staircase, and from how far in a run.
staircase=0.45
staircase_from_m=300.0
; Heights above the ground in pixels (Rok is about 170 px tall).
arc_height=200.0
trail_height=290.0
island_min_lift=160.0
island_max_lift=240.0

[escalation]
; Meat turns into big meat (worth 3) more often deeper into a run.
big_meat_from_m=2000.0
big_meat_full_m=6000.0
big_meat_max=0.4
; Rare fossils: none before fossil_from_m, then a share of spots rising
; from fossil_min to fossil_max at fossil_full_m.
fossil_from_m=4000.0
fossil_full_m=9000.0
fossil_min=0.03
fossil_max=0.08

[break_loot]
; Chance a broken obstacle drops something.
chance=0.12
; Of those drops: share that is a heart (amber at full health) and share
; that is a power-up; the rest is amber.
heart=0.15
power=0.2
; Amber pieces in an amber drop.
amber_count=3
; Also drop loot during a Primal Frenzy (it already rains meat).
in_frenzy=false

[chests]
; Milestone chests (one every 1000 m of a run, tuning.gd CHEST_EVERY_M).
; A chest's rarity is rolled when it is placed, so you can see it coming:
; common (red-brown), rare (teal), ultra_rare (purple obsidian) or
; legendary (amber-gold). Each tier's chance is
;   [chance at the first milestone, + this per milestone after it, cap]
; and checked rarest first; common gets whatever is left over.
rare=[0.22, 0.03, 0.45]
ultra_rare=[0.04, 0.04, 0.30]
legendary=[0.01, 0.015, 0.12]
; Meat and XP in a meat / XP reward, per tier (common, rare, ultra_rare,
; legendary). Meat gets +1 per milestone; XP x(1 + milestone/3).
meat=[4, 8, 15, 30]
xp=[150, 400, 1000, 2500]
; Points for opening any chest, and how many combo feats it counts as.
score=500
combo_weight=2
; What each tier can hold (one, picked evenly): meat, xp, booster, heart,
; full_heal, frenzy, card, materials (config/crafting.cfg [chests]).
; Ultra rare and legendary cards favour the higher-tier dinosaurs.
rewards_common=["meat", "xp", "materials"]
rewards_rare=["meat", "xp", "booster", "heart", "card", "materials"]
rewards_ultra_rare=["meat", "xp", "frenzy", "full_heal", "card", "materials"]
rewards_legendary=["meat", "xp", "frenzy", "full_heal", "card", "materials"]

[power_ups]
; Which power-up a spot or drop holds (only ones the player owns): the Dino
; Egg egg_share of the time, otherwise one of the others by weight
; (a power-up not listed weighs 1).
egg_share=0.5
amber_shield=1.0
fossil_magnet=1.0
time_crystal=1.0
primal_berry=1.0
golden_fossil=1.0
