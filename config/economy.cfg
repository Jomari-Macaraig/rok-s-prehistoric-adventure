; =====================================================================
;  Rok Runner - economy: what things are worth, and selling
;
;  In the Market's Sell tab the player sells crafted gear (not equipped),
;  materials and spare dinosaur cards for meat. The merchant pays `share`
;  (80%, the user's rule) of an item's VALUE. Read by scripts/economy.gd
;  (Economy). Save and restart the game.
; =====================================================================

[sell]
share = 0.8

[value]
; One piece of a material: a material sold in the Market is worth its
; bundle price / the bundle size (config/crafting.cfg [market]); the others
; by rarity (Common, Uncommon, Rare, Epic, Legendary).
material_by_rarity = [8, 20, 45, 110, 280]
; Crafted gear: the value of its recipe's materials, times its rarity's bonus
; multiplier (config/crafting.cfg [rarity]), times its durability left (worn
; gear is worth less), but never below this share of its full value.
gear_min_share = 0.3
; A dinosaur card by its dinosaur's tier: Original, Starter, Skilled, Expert, Legend.
card_by_tier = [60, 80, 140, 260, 500]
