; =====================================================================
;  Rok Runner - missions: daily and weekly
;
;  Three small goals a day and three bigger ones a week, picked from the
;  mission pool (scripts/missions.gd POOL) by the date or the week, only
;  from what the player can already do. They're listed behind the main
;  menu's Missions button. Read by scripts/missions.gd. Save and restart.
; =====================================================================

[daily]
count = 3
meat = 25            ; meat for each mission done
all_meat = 50        ; bonus when all of the day's are done...
streak_meat = 15     ; ...plus this per day of the streak after the first
streak_max = 6       ; (capped at this many days)
target_mult = 1.0    ; "total" targets (collect, smash...) x this

[weekly]
; A week starts on Monday. Weekly missions count across every run that week.
count = 3
meat = 120
all_meat = 300
streak_meat = 0      ; no streak bonus for weeks
streak_max = 0
target_mult = 6.0    ; a week's "total" targets are this many days' worth
run_m_share = 0.9    ; the "run N m" target: this share of your best run (daily: 0.6)
combo_plus = 1       ; the "reach a xN combo" target: one step above the daily one
